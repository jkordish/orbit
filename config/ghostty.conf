# Reproducible Ghostty preferences managed by orbit.
font-family = JetBrainsMono Nerd Font Mono

# Typography and layout.
font-size = 14
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = background
macos-titlebar-style = transparent
macos-icon = holographic
window-theme = dark
window-show-tab-bar = auto
macos-window-shadow = true
minimum-contrast = 1.05

# Macaron: soft pastels on charcoal.
background = #1C202B
foreground = #DCE5E3
background-opacity = 0.95
background-blur = 18
background-opacity-cells = true

# Cursor and selection.
cursor-color = #A6E3A1
cursor-text = #1C202B
cursor-style = block
cursor-style-blink = false
selection-background = #3F4A5C
selection-foreground = #F1F5F2

# Standard ANSI colors: black, red, green, yellow,
# blue, magenta, cyan, white.
palette = 0=#2A3040
palette = 1=#E7A1B0
palette = 2=#B7D9C2
palette = 3=#E8D7A9
palette = 4=#A7C7E7
palette = 5=#CBBEE9
palette = 6=#A9D8D5
palette = 7=#DCE5E3

# Bright ANSI colors.
palette = 8=#818BA3
palette = 9=#EFB7C2
palette = 10=#CAE6D2
palette = 11=#F2E3BC
palette = 12=#BED8F2
palette = 13=#DDD0F4
palette = 14=#C2E7E3
palette = 15=#F1F5F2

# Distinguish the active pane without obscuring other panes.
unfocused-split-opacity = 0.78
split-divider-color = #3F4A5C
mouse-hide-while-typing = true

# Glass by default; Cmd+Shift+O makes dense logs fully opaque on demand.
keybind = cmd+shift+o=toggle_background_opacity
keybind = cmd+shift+enter=toggle_split_zoom
keybind = cmd+shift+p=toggle_command_palette
keybind = global:cmd+backquote=toggle_quick_terminal
command-palette-entry = title:"Orbit: Toggle Glass",description:"Switch between blurred and opaque terminal surfaces.",action:toggle_background_opacity
command-palette-entry = title:"Orbit: Focus Active Pane",description:"Zoom the active pane for a distraction-free work surface.",action:toggle_split_zoom
command-palette-entry = title:"Orbit: Reload Config",description:"Reload the managed Ghostty configuration.",action:reload_config
command-palette-entry = title:"Orbit: Quick Terminal",description:"Summon the drop-down terminal from anywhere.",action:toggle_quick_terminal
command-palette-entry = title:"Orbit: New Dev Tab",description:"Open a fresh tab in the current workspace.",action:new_tab
command-palette-entry = title:"Orbit: Split Right",description:"Open a development pane to the right.",action:new_split:right
command-palette-entry = title:"Orbit: Split Down",description:"Open a development pane below.",action:new_split:down
command-palette-entry = title:"Orbit: Focus Right",description:"Move focus to the next pane on the right.",action:goto_split:right
command-palette-entry = title:"Orbit: Focus Left",description:"Move focus to the next pane on the left.",action:goto_split:left
command-palette-entry = title:"Orbit: Balance Panes",description:"Give each split an even share of the workspace.",action:equalize_splits
command-palette-entry = title:"Orbit: Previous Prompt",description:"Jump back to the previous marked shell prompt.",action:"jump_to_prompt:-1"
command-palette-entry = title:"Orbit: Next Prompt",description:"Jump forward to the next marked shell prompt.",action:"jump_to_prompt:1"

# A compact drop-down terminal for quick notes, commands, and scratch work.
quick-terminal-position = top
quick-terminal-size = 42%
quick-terminal-screen = main
quick-terminal-animation-duration = 0.18
quick-terminal-autohide = true

# Scrollback budget: 64 MiB per terminal.
scrollback-limit = 67108864

# Keep automatic shell integration.
shell-integration = detect
shell-integration-features = ssh-env,ssh-terminfo,title
window-save-state = always
window-inherit-working-directory = true
tab-inherit-working-directory = true
split-inherit-working-directory = true

# Notify when a command lasting at least 30 seconds finishes,
# but only when its terminal is not focused.
notify-on-command-finish = unfocused
notify-on-command-finish-action = no-bell,notify
notify-on-command-finish-after = 30s
